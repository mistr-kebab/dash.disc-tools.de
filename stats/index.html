<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disc-Tools Statistics - Real-Time Bot &amp; Community Growth Metrics</title>
    <meta name="description" content="Real-time Disc-Tools statistics - active servers, total users, community members, and daily growth charts. Track the bot's reach and community expansion over 7 and 30 day periods.">
    <meta property="og:title" content="Disc-Tools Statistics - Bot Growth &amp; Community Metrics">
    <meta property="og:description" content="Real-time Disc-Tools statistics - active servers, total users, community members, and daily growth charts. Track the bot's reach and community expansion.">
    <meta property="og:image" content="https://dash.disc-tools.de/static/assets/img/og/stats.png">
    <meta name="twitter:image" content="https://dash.disc-tools.de/static/assets/img/og/stats.png">
    <meta property="og:url" content="https://dash.disc-tools.de/stats/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://dash.disc-tools.de/stats/">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/stats.css">
    <link rel="stylesheet" href="/static/icons/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/assets/img/icon.png">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://dash.disc-tools.de"},
            {"@type": "ListItem", "position": 2, "name": "Statistics", "item": "https://dash.disc-tools.de/stats"}
        ]
    }
    </script>
</head>
<body>
    <template-header data-page="stats"></template-header>

    <main class="stats-page">
        <div class="stats-hero">
            <h1><i class="fa-solid fa-chart-line"></i> Statistics</h1>
            <p>Real-time numbers across all servers running Disc-Tools.</p>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-card-icon"><i class="fa-solid fa-server"></i></div>
                <div class="stat-card-value" id="stat-servers">-</div>
                <div class="stat-card-label">Servers</div>
                <div class="stat-card-sub">Guilds using Disc-Tools</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-card-value" id="stat-community">-</div>
                <div class="stat-card-label">Community Members</div>
                <div class="stat-card-sub">On our Discord server</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon"><i class="fa-solid fa-globe"></i></div>
                <div class="stat-card-value" id="stat-total">-</div>
                <div class="stat-card-label">Total Users</div>
                <div class="stat-card-sub">Across all servers</div>
            </div>
        </div>

        <section class="chart-section">
            <div class="chart-header">
                <h2><i class="fa-solid fa-chart-bar"></i> Daily History</h2>
                <div class="chart-toggle">
                    <button   id="btn-7d" class="active">7 days</button>
                    <button   id="btn-30d">30 days</button>
                </div>
            </div>
            <div class="chart-legend">
                <div class="chart-legend-item"><span class="chart-legend-dot servers"></span> Servers</div>
                <div class="chart-legend-item"><span class="chart-legend-dot community"></span> Community</div>
                <div class="chart-legend-item"><span class="chart-legend-dot total"></span> Total Users</div>
            </div>
            <div class="chart-area" id="chart-area">
                <svg viewBox="0 0 800 320" preserveAspectRatio="none"></svg>
                <div class="chart-tooltip" id="chart-tooltip" hidden></div>
            </div>
            <div class="chart-labels" id="chart-labels"></div>
        </section>

        <div class="comparison-row">
            <div class="comp-card">
                <div>
                    <div class="comp-label"><i class="fa-solid fa-server"></i> Servers</div>
                    <div class="comp-value" id="comp-servers-val">-</div>
                </div>
                <div class="comp-diff neutral" id="comp-servers">-</div>
            </div>
            <div class="comp-card">
                <div>
                    <div class="comp-label"><i class="fa-solid fa-users"></i> Community</div>
                    <div class="comp-value" id="comp-community-val">-</div>
                </div>
                <div class="comp-diff neutral" id="comp-community">-</div>
            </div>
            <div class="comp-card">
                <div>
                    <div class="comp-label"><i class="fa-solid fa-globe"></i> Total Users</div>
                    <div class="comp-value" id="comp-total-val">-</div>
                </div>
                <div class="comp-diff neutral" id="comp-total">-</div>
            </div>
        </div>
    </main>

    <template-footer></template-footer>

    <script src="/static/js/components.js?v=3"></script>
    <script src="/static/js/cookie-banner.js?v=3"></script>
    <script src="/static/js/auth.js?v=2"></script>
    <script src="/static/js/stats.js?v=1"></script>
    <script defer src="https://umami.disc-tools.de/script.js" data-website-id="71c24f0f-5dfe-41b7-a2ba-0585cba7946c"></script>
</body>
</html>
