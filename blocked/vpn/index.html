<div class="blocked-card">
<div class="blocked-card-icon"><i class="fa-solid fa-shield-halved"></i></div>
<h1>Access Restricted</h1>
<p>Our security system detected a VPN, Proxy, or Hosting connection. Access is restricted for these connection types.</p>

<div class="vpn-details" id="vpn-details">
<div class="vpn-row"><span class="vpn-label">IP Address</span><span class="vpn-value" id="det-ip">-</span></div>
<div class="vpn-row"><span class="vpn-label">Type</span><span class="vpn-value" id="det-type">-</span></div>
<div class="vpn-row"><span class="vpn-label">Provider</span><span class="vpn-value" id="det-provider">-</span></div>
<div class="vpn-row"><span class="vpn-label">ASN</span><span class="vpn-value" id="det-asn">-</span></div>
</div>

<a href="/" class="blocked-btn">Retry Connection</a>

<div class="blocked-divider">or</div>

<a href="/api/auth/login" class="blocked-btn blocked-btn-discord"><i class="fa-brands fa-discord"></i> Login with Discord</a>
<p class="blocked-note">Logged-in users are exempt from this check.</p>
</div>
