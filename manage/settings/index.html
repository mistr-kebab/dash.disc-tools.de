<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Settings – Disc-Tools</title>
    <meta property="og:title" content="Server Settings – Disc-Tools">
    <meta property="og:description" content="Configure Disc-Tools for your server.">
    <meta property="og:image" content="https://dash.disc-tools.de/static/assets/img/icon.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="/static/css/manage.css">
    <link rel="stylesheet" href="/static/icons/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/assets/img/icon.png">
</head>
<body>
    <main class="profile-page">
        <nav class="profile-sidebar" id="profile-sidebar">
            <div class="profile-sidebar-section">
                <div class="profile-sidebar-user">
                    <div class="server-sidebar-icon" id="server-sidebar-icon"><i class="fa-solid fa-server"></i></div>
                    <div class="profile-sidebar-name">
                        <strong id="server-sidebar-name">Loading…</strong>
                        <span id="server-sidebar-id">—</span>
                    </div>
                </div>
            </div>
            <div class="profile-sidebar-section">
                <button class="profile-sidebar-section-label" onclick="this.parentElement.classList.toggle('collapsed')">
                    Server
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="profile-sidebar-section-items">
                    <a href="" class="profile-nav-item" id="nav-overview" data-panel="overview">
                        <i class="fa-solid fa-house"></i> <span>Overview</span>
                    </a>
                </div>
            </div>
            <div class="profile-sidebar-section">
                <button class="profile-sidebar-section-label" onclick="this.parentElement.classList.toggle('collapsed')">
                    Features
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="profile-sidebar-section-items">
                    <a href="" class="profile-nav-item" id="nav-verification" data-panel="verification">
                        <i class="fa-solid fa-circle-check"></i> <span>Verification</span>
                    </a>
                </div>
            </div>
            <div class="profile-sidebar-bottom">
                <a href="" class="profile-nav-item active" id="nav-settings">
                    <i class="fa-solid fa-gear"></i> <span>Settings</span>
                </a>
                <a href="/my-servers" class="profile-nav-item"><i class="fa-solid fa-arrow-left"></i> <span>Back to Servers</span></a>
            </div>
        </nav>
        <div class="profile-panel">
            <h2><i class="fa-solid fa-gear"></i> Settings</h2>
            <p class="profile-panel-sub" id="server-sub">—</p>

            <div class="settings-card">
                <div class="setting-row">
                    <div class="setting-info">
                        <label class="setting-label" for="setting-log-channel">Audit Log Channel</label>
                        <div class="setting-desc">Channel where the bot logs when dashboard settings are changed.</div>
                    </div>
                    <div class="setting-control">
                        <select id="setting-log-category" aria-label="Filter by category">
                            <option value="">All Categories</option>
                        </select>
                        <select id="setting-log-channel">
                            <option value="">— None —</option>
                        </select>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-audit-log" aria-label="Enable audit log">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-actions">
            </div>
        </div>
        <div class="unsaved-bar" id="unsaved-bar">
            <div class="unsaved-bar-text">You have unsaved changes</div>
            <div class="unsaved-bar-actions">
                <button class="unsaved-btn-discard" id="btn-discard">Discard</button>
                <button class="unsaved-btn-save" id="btn-save-bar">Save Changes</button>
            </div>
        </div>
        <div class="toast" id="toast" hidden></div>
    </main>
    <script src="/static/js/cookie-banner.js?v=2"></script>
    <script src="/static/js/auth.js?v=2"></script>
    <script src="/static/js/server-settings.js"></script>
    <script defer src="https://umami.disc-tools.de/script.js" data-website-id="71c24f0f-5dfe-41b7-a2ba-0585cba7946c"></script>
</body>
</html>
