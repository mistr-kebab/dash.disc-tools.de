<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview – Disc-Tools</title>
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Profile – Disc-Tools">
    <meta property="og:description" content="Your account details, premium status, and server overview.">
    <meta property="og:image" content="https://dash.disc-tools.de/static/assets/img/icon.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="/static/icons/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/assets/img/icon.png">
</head>
<body>
    <main class="profile-page">
        <nav class="profile-sidebar" id="profile-sidebar">
            <div class="profile-sidebar-logo-row">
                <a href="/" class="profile-sidebar-logo">
                    <img src="/static/assets/img/icon.png" alt="Disc-Tools">
                    <span>Disc<span class="accent">-</span>Tools</span>
                </a>
                <button class="profile-sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
                    <i class="fa-solid fa-angles-left"></i>
                </button>
            </div>
            <div class="profile-sidebar-section">
                <button class="profile-sidebar-section-label" onclick="this.parentElement.classList.toggle('collapsed')">
                    General
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="profile-sidebar-section-items">
                    <a href="/profile/general/overview" class="profile-nav-item active"><i class="fa-solid fa-id-card"></i> <span>Overview</span></a>
                </div>
            </div>
            <div class="profile-sidebar-section">
                <button class="profile-sidebar-section-label" onclick="this.parentElement.classList.toggle('collapsed')">
                    Sessions
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="profile-sidebar-section-items">
                    <a href="/profile/security/sessions" class="profile-nav-item"><i class="fa-solid fa-shield-halved"></i> <span>Sessions</span></a>
                </div>
            </div>
            <div class="profile-sidebar-section">
                <button class="profile-sidebar-section-label" onclick="this.parentElement.classList.toggle('collapsed')">
                    Billing
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="profile-sidebar-section-items">
                    <a href="/profile/billing/premium-history" class="profile-nav-item"><i class="fa-solid fa-crown"></i> <span>Premium</span></a>
                    <a href="/profile/billing/manage" class="profile-nav-item"><i class="fa-solid fa-sliders"></i> <span>Manage</span></a>
                </div>
            </div>
            <div class="profile-sidebar-bottom">
                <div class="profile-sidebar-user">
                    <div class="profile-avatar" id="profile-avatar"></div>
                    <div class="profile-sidebar-name">
                        <strong id="profile-name">-</strong>
                        <span id="profile-username">-</span>
                    </div>
                </div>
                <a href="/profile/settings" class="profile-nav-item"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
                <button class="profile-nav-item" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Logout</span>
                </button>
            </div>
        </nav>
        <div class="profile-panel">
            <h2><i class="fa-solid fa-id-card"></i> Overview</h2>
            <p class="profile-panel-sub">Your account details and subscription status.</p>
            <div class="overview-grid">
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-user"></i></span>
                    <div>
                        <span class="overview-label">Display Name</span>
                        <span class="overview-value" id="ov-display-name">-</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-at"></i></span>
                    <div>
                        <span class="overview-label">Username</span>
                        <span class="overview-value" id="ov-username">-</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-fingerprint"></i></span>
                    <div>
                        <span class="overview-label">User ID</span>
                        <span class="overview-value" id="ov-user-id">-</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-envelope"></i></span>
                    <div>
                        <span class="overview-label">Email</span>
                        <span class="overview-value" id="ov-email">-</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-crown"></i></span>
                    <div>
                        <span class="overview-label">Premium</span>
                        <span class="overview-value" id="ov-premium">-</span>
                        <span class="overview-sub" id="ov-premium-sub"></span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-calendar"></i></span>
                    <div>
                        <span class="overview-label">Member Since</span>
                        <span class="overview-value" id="ov-joined">-</span>
                        <span class="overview-sub">Discord account created</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-server"></i></span>
                    <div>
                        <span class="overview-label">Servers</span>
                        <span class="overview-value" id="ov-server-count">-</span>
                        <span class="overview-sub">Guilds you manage with Disc-Tools</span>
                    </div>
                </div>
                <div class="overview-item">
                    <span class="overview-icon"><i class="fa-solid fa-door-open"></i></span>
                    <div>
                        <span class="overview-label">Joined Community</span>
                        <span class="overview-value" id="ov-guild-joined">-</span>
                        <span class="overview-sub">When you joined our Discord</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="/static/js/cookie-banner.js?v=2"></script>
    <script src="/static/js/auth.js?v=2"></script>
    <script src="/static/js/profile.js?v=2"></script>
    <script defer src="https://umami.disc-tools.de/script.js" data-website-id="71c24f0f-5dfe-41b7-a2ba-0585cba7946c"></script>
</body>
</html>
